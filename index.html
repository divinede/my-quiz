<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultimate Quiz Challenge</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #1f4037, #99f2c8);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      overflow: hidden;
    }

    .container {
      background: rgba(0, 0, 0, 0.8);
      padding: 25px;
      border-radius: 15px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    h1 {
      font-size: 1.8em;
      margin-bottom: 15px;
    }

    #question {
      font-size: 1.2em;
      margin-bottom: 10px;
    }

    #timer {
      font-size: 1.1em;
      margin-bottom: 15px;
      color: #ffeb3b;
    }

    .option {
      background: #333;
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .option:hover {
      background: #007bff;
    }

    #nextBtn {
      background: #28a745;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      margin-top: 10px;
    }

    #nextBtn:hover {
      background: #218838;
    }

    #score {
      font-size: 1.3em;
      margin-top: 15px;
    }

    .emoji-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 60px;
      transition: transform 0.3s ease;
      pointer-events: none;
    }

    .emoji-popup.show {
      transform: translate(-50%, -50%) scale(1.3);
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: fall 1.5s linear forwards;
      opacity: 0.9;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(600px) rotate(720deg); opacity: 0; }
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.5em; }
      #question { font-size: 1.1em; }
      #timer { font-size: 1em; }
      .option { font-size: 0.95em; padding: 8px; }
      #nextBtn { padding: 8px 16px; font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 Ultimate Quiz Challenge</h1>
    <div id="question"></div>
    <div id="timer">⏱ Time Left: <span id="time">15</span>s</div>
    <div id="options"></div>
    <button id="nextBtn">Next</button>
    <div id="score"></div>
    <div class="emoji-popup" id="emoji"></div>
  </div>

  <script>
    const quizData = [
      { question: "What is 5 + 3?", options: ["5", "8", "9", "7"], answer: "8" },
      { question: "Which planet is known as the Red Planet?", options: ["Earth", "Mars", "Jupiter", "Saturn"], answer: "Mars" },
      { question: "What color is the sky on a clear day?", options: ["Blue", "Red", "Green", "Pink"], answer: "Blue" },
      { question: "How many days are in a leap year?", options: ["365", "366", "367", "364"], answer: "366" },
      { question: "Who wrote 'Romeo and Juliet'?", options: ["Charles Dickens", "William Shakespeare", "J.K. Rowling", "Leo Tolstoy"], answer: "William Shakespeare" },
      { question: "What is the capital of Japan?", options: ["Tokyo", "Beijing", "Seoul", "Bangkok"], answer: "Tokyo" },
      { question: "What is the square root of 144?", options: ["10", "11", "12", "14"], answer: "12" },
      { question: "Which gas do plants use for photosynthesis?", options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], answer: "Carbon Dioxide" },
      { question: "Who developed the theory of relativity?", options: ["Isaac Newton", "Albert Einstein", "Nikola Tesla", "Galileo"], answer: "Albert Einstein" },
      { question: "What is the largest ocean on Earth?", options: ["Atlantic", "Indian", "Pacific", "Arctic"], answer: "Pacific" }
    ];

    let currentQuestion = 0;
    let score = 0;
    let timer;
    let timeLeft = 15;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const nextBtn = document.getElementById("nextBtn");
    const scoreEl = document.getElementById("score");
    const emoji = document.getElementById("emoji");
    const container = document.querySelector(".container");
    const timeDisplay = document.getElementById("time");

    function loadQuestion() {
      clearInterval(timer);
      timeLeft = 15;
      timeDisplay.textContent = timeLeft;
      startTimer();

      emoji.classList.remove("show");
      const q = quizData[currentQuestion];
      questionEl.textContent = q.question;
      optionsEl.innerHTML = "";
      q.options.forEach(opt => {
        const div = document.createElement("div");
        div.classList.add("option");
        div.textContent = opt;
        div.onclick = () => selectAnswer(opt);
        optionsEl.appendChild(div);
      });
      nextBtn.style.display = "none";
    }

    function startTimer() {
      timer = setInterval(() => {
        timeLeft--;
        timeDisplay.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          autoNext();
        }
      }, 1000);
    }

    function selectAnswer(selected) {
      clearInterval(timer);
      const correct = quizData[currentQuestion].answer;
      if (selected === correct) {
        score++;
        showSuccess();
      } else {
        showFail();
      }
      nextBtn.style.display = "block";
    }

    function autoNext() {
      showFail();
      setTimeout(() => {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
          loadQuestion();
        } else {
          showScore();
        }
      }, 800);
    }

    function showSuccess() {
      emoji.textContent = "🎉";
      emoji.classList.add("show");
      launchConfetti();
      setTimeout(() => emoji.classList.remove("show"), 1000);
    }

    function showFail() {
      emoji.textContent = "⏰";
      emoji.classList.add("show");
      setTimeout(() => emoji.classList.remove("show"), 1000);
    }

    function launchConfetti() {
      for (let i = 0; i < 25; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left = Math.random() * 100 + "%";
        confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confetti.style.animationDuration = (Math.random() * 2 + 1) + "s";
        container.appendChild(confetti);
        setTimeout(() => confetti.remove(), 1500);
      }
    }

    nextBtn.onclick = () => {
      clearInterval(timer);
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        loadQuestion();
      } else {
        showScore();
      }
    };

    function showScore() {
      questionEl.textContent = "🎉 Quiz Completed!";
      optionsEl.innerHTML = "";
      document.getElementById("timer").style.display = "none";
      scoreEl.textContent = `Your score: ${score} / ${quizData.length}`;
      nextBtn.style.display = "none";
    }

    loadQuestion();
  </script>
</body>
</html>
